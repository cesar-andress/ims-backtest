criteria:
  IMPV: unmapped
  IMPC: unmapped
  GRW: unmapped
  GDPPC: unmapped
  DIST: [INTC]
  TARIF: [CIBC]
  FTA: [PPAD]
  LPI: [LPIN]
  ASIASH: [CUTA]
  HHI: [CCTI]
  UVGAP: unmapped
  CULT: [CUDI]
  LANG: [GLIN]
  INFL: [INAN]
  UNEMP: [UNRA]
  GOV: [FSIN, INRI, DEIN]
  EOC: [CLI]
  REEXP: unmapped
