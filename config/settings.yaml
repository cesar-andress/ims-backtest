# Empirical units and run settings (SPEC §3.1, §3.3).
origins:
  - COL
  - PER
  - MEX
  - CHL
  - ECU
  - BRA
  - ARG

n_destinations: 60

hs_chapters:
  primary: "64"
  robustness:
    - "61"
    - "62"
    - "42"
    - "09"

years:
  start: 2012
  end: 2023

horizons:
  - 1
  - 3

entry_threshold_usd: 50000

seed: 42

# CEPII BACI — URL verified against cepii.fr DATA_DOWNLOAD (HTTP 200, 2026-11-17).
# Update url/version together when CEPII publishes a new release.
baci:
  nomenclature: HS12
  version: "202601"
  url: "https://www.cepii.fr/DATA_DOWNLOAD/baci/data/BACI_HS12_V202601.zip"

# CEPII Gravity — CSV zip verified against cepii.fr DATA_DOWNLOAD (HTTP 200, 2026-11-17).
cepii_gravity:
  version: "202211"
  url: "https://www.cepii.fr/DATA_DOWNLOAD/gravity/data/Gravity_csv_V202211.zip"

# WITS TRN SDMX (applied preferential AHS). Reporters = destinations
# (EU members → 918); partners = origins; HS6 lines aggregated to chapter means.
wits:
  version: "trn-ahs-v1"
  base_url: "https://wits.worldbank.org/API/V1/SDMX/V21/datasource/TRN"
  indicator: "AHS-SMPL-AVRG"
  product: "all"
  locf: true
  max_workers: 8
  retries: 5
  backoff_sec: 1.5

worldbank:
  wdi_source_id: 2
  wgi_source_id: 3

smaa:
  n_samples: 10000
  seed: 42

bootstrap:
  n_reps: 2000
  seed: 42
