[project]
name = "imsfe"
version = "0.1.0"
description = "Validated, reproducible international market selection framework (IMSFE 2.0)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "Jose Jaime Baena-Rojas" },
  { name = "Jose Alejandro Cano" },
  { name = "César Andrés-Sanchez" },
]
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "wbgapi>=1.0.12",
  "requests>=2.31",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "typer>=0.12",
  "pymcdm>=1.2",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "pyfixest>=0.21",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "xgboost>=2.0",
  "shap>=0.44",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "adjusttext>=1.4.0",
]

[project.scripts]
imsfe = "imsfe.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imsfe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
